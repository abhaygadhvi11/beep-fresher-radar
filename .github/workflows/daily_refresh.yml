name: Automated Daily Fresher Job Refresh

on:
  schedule:
    # Runs every day at 00:00 UTC (05:30 AM IST)
    - cron: '0 0 * * *'
  # Allows manual on-demand trigger from GitHub Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Job Ingestion, Deduplication & LLM Tagging Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python pipeline/run_pipeline.py

      - name: Commit and Push Updated Job Data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/ web/public/ jobs.json jobs_data.js validation_50.csv accuracy_report.json index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): automated daily fresher job refresh [skip ci]" && git push origin main)

